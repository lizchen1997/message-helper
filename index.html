<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訊息自動回覆模板產生器</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 24px;
            color: var(--primary);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }
        select, input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: var(--primary-hover);
        }
        .result-box {
            margin-top: 24px;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 15px;
            border-radius: 6px;
            position: relative;
        }
        #resultText {
            white-space: pre-wrap;
            word-break: break-all;
            margin: 0;
            font-size: 15px;
            line-height: 1.6;
        }
        .copy-btn {
            margin-top: 10px;
            background-color: #10b981;
        }
        .copy-btn:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💬 訊息快速回覆產生器</h1>
    
    <!-- 1. 選擇情境 -->
    <div class="form-group">
        <label for="scenario">1. 選擇溝通情境</label>
        <select id="scenario" onchange="updateTemplates()">
            <option value="dietitian_match">配對營養師</option>
            <option value="ask_time">詢問一對一分析時間</option>
            <option value="appointment_reservation_1v1">一對一分析時間提醒</option>
            <option value="ask_course_guidance_time">詢問課程指導時間</option>
            <option value="prep_work_1v1">一對一分析事前作業</option>
        </select>
    </div>

    <!-- 2. 輸入參與人員 -->
    <div class="form-group">
        <label for="members">2. 參與人員 / 網紅 / 客戶姓名</label>
        <input type="text" id="members" placeholder="例如：王小明" value="">
    </div>

    <!-- 3. 選擇訊息語氣/模板 -->
    <div class="form-group">
        <label for="template">3. 選擇訊息模板</label>
        <select id="template">
            <!-- 這裡會根據情境動態更新 -->
        </select>
    </div>

    <button class="btn" onclick="generateMessage()">✨ 生成訊息內容</button>

    <!-- 成果展示與複製 -->
    <div class="result-box">
        <label>生成結果：</label>
        <p id="resultText">填寫上方欄位並點擊「生成訊息」...</p>
        <button class="btn copy-btn" onclick="copyToClipboard()">📋 複製訊息</button>
    </div>
</div>

<script>
    // 定義所有情境與模板資料 (已整合情境五，清除影響運作的非法字元)
    const templateData = {
        dietitian_match: [
            { 
                id: "dm1", 
                name: "【詢問國內網紅一對一分析資料】", 
                text: "{members} 好~\n我們將安排營養師進行一對一分析以及合約製作\n請您提供以下資訊，以便我們進行後續的作業：\n• 本名：\n• 手機號碼：\n⚠️請提供本人使用的手機號碼，後續資料將綁定此門號，請於問卷及 APP 登入使用相同號碼。\n• 本人常用 Email（系統通知使用）：\n• 合約收件 Email（如同上可免填）：\n•勞報/開立發票（如開發票請提供公司名）：\n\n因後續將提供保健品，預計會在開課前寄出，所以寄送的收件資訊也同步麻煩了!\n\n• 收件人：\n• 收件地址：\n• 收件電話：\n\n以上再麻煩了，感謝!" 
            },
             { 
                id: "dm2", 
                name: "【詢問國外網紅一對一分析資料】", 
                text: "{members} 好~\n\n我們將安排營養師進行一對一分析以及合約製作\n請您提供以下資訊，以便我們進行後續的作業：\n• 本名：\n• 國外手機號碼：\n⚠️請提供本人使用的手機號碼，後續資料將綁定此門號，請於問卷及 APP 登入使用相同號碼。\n• 本人常用 Email（系統通知使用）：\n• 合約收件 Email（如同上可免填）：\n•勞報/開立發票（如開發票請提供公司名）：\n\n以上再麻煩了，感謝!" 
            }
        ],
        ask_time: [
            { 
                id: "at1", 
                name: "【營養師實體時間】", 
                text: "{members} 好~ \n我是立慈~~\n之後會和Ellie一起協助配對營養師和追蹤體驗流程喔！\n請問x/x ~ x/x 是否有可以進行實體一對一分析的時間呢？再麻煩提供3個可以的時段，謝謝！" 
            },
            { 
                id: "at2", 
                name: "【營養師線上時間】", 
                text: "{members} 好~ \n我是立慈~~\n之後會和Ellie一起協助配對營養師和追蹤體驗流程喔！\n請問x/x ~ x/x 是否有可以進行線上一對一分析的時間呢？再麻煩提供3個可以的時段，謝謝！" 
            },
            { 
                id: "at3", 
                name: "【約網紅一對一分析時間】", 
                text: "{members} 您好~ \n營養師已提供一對一體態與飲食分析的時間了!\n服務包含：\n1.專業身體組成量測\n2.身體數據評估、飲食習慣檢視以及荷爾蒙體質評測。\n\n時間約 30 分鐘/人\n但建議還是可以多預留一些時間比較好😊\n時段如下：\n\n\n請問哪個時段方便呢？" 
            }
        ],
        appointment_reservation_1v1: [
            { 
                id: "ar1", 
                name: "【實體1v1提醒】", 
                text: "{members} 好~ \n🔖一對一提醒\n\n姓名：\n\n時間：\n\n營養師：\n\n地點：台北初日\n\n地址：台北市中山區民生東路二段161號4樓\n(行天宮捷運一號出口，第一銀行樓上)" 
            },
            { 
                id: "ar2", 
                name: "【線上1v1提醒】", 
                text: "{members} 好~ \n🔖一對一提醒\n\n姓名：\n\n時間：\n\n營養師：\n\n地點：線上\n\nGoogle meet：" 
            }
        ],
        ask_course_guidance_time: [
            {
                id: "cg1",
                name: "【營養師實體回診時間】",
                text: "{members} 好~ \n請問x/x ~ x/x 是否有可以進行實體課程指導的時間呢？\n再麻煩提供3個可以的時段，謝謝！"
            },
            {
                id: "cg2",
                name: "【營養師線上回診時間】",
                text: "{members} 好~ \n請問x/x ~ x/x 是否有可以進行線上課程指導的時間呢？\n再麻煩提供3個可以的時段，謝謝！"
            },
            {
                id: "cg3",
                name: "【約網紅課程指導實體時間】",
                text: "{members} 好~ \n課程進行到一半了，我們會安排您和營養師一對一的課程指導時間\n營養師會和您一起回顧這段時間的努力，確認目前的飲食是否需要調整，來達到我們一起訂的目標💪\n如果有任何問題也可以趁這個機會和營養師提出喔🙇\n\n時間約 15 分鐘/人\n但建議還是可以多預留一些時間比較好😊\n\n地點：台北初日\n地址：台北市中山區民生東路二段161號4樓（第一銀行樓上）\n時段如下：\n\n\n請問哪個時段方便呢？"
            },
            {
                id: "cg4",
                name: "【約網紅課程指導線上時間】",
                text: "{members} 好~ \n課程進行到一半了，我們會安排您和營養師線上一對一的課程指導時間\n營養師會和您一起回顧這段時間的努力，確認目前的飲食是否需要調整，來達到我們一起訂的目標💪\n如果有 any 問題也可以趁這個機會和營養師提出喔🙇\n\n時間約 15 分鐘/人\n重播：但建議還是可以多預留一些時間比較好😊\n\n線上時段如下：\n\n\n請問哪個時段方便呢？"
            }
        ],
        prep_work_1v1: [
            {
                id: "pw1",
                name: "【問卷填寫】",
                text: "{members} 好~\n這邊提供營養師分析前的執行事項，再麻煩一對一分析前按照以下步驟完成：\n1.問卷填寫\n2.APP ID\n\n謝謝！\n\n【步驟1】\n🏷️下載 Cofit App『Cofit - 我的專屬營養師』\nApple: https://tinyurl.com/28ta4b6z\n安卓: https://goo.gl/uM0y4v\n⚠️提醒：為確保資料一致，登入APP與填寫問卷時，請使用先前提供的手機號碼，並於相關作業中皆使用同一門號。\n\n【步驟2】\n🏷️完成 Cofit APP 下載後，請填寫 2 份問卷唷！\n1️⃣飲食及生活習慣問卷：https://hi.cofit.me/6GU5p\n2️⃣六大荷爾蒙體質分析問卷：https://hi.cofit.me/fl97W\n- 請使用本人的手機號碼登入問卷系統，且不得與他人共用號碼\n- 請盡量以「真實姓名」填寫，若以其他姓名填寫也請主動跟我們說，避免營養師核對不到資料無法為您分析喔！\n- 完成問卷後請確認「提交」並務必回來跟我說，以利營養師核對唷！\n\n【步驟3】\n🏷️2 日自主飲食紀錄\n請上傳個人飲食照片至 Cofit App。 一對一分析時，營養師將會透過 App 檢視您的 2 日飲食唷！\n飲食記錄請上傳至「日記」頁面，教學影片 https://youtube.com/shorts/xDKhdt7lGyg\n⚠️小提醒：飲食記錄請上傳至「日記」頁面，不是跟營養師的對話裡喔！"
            },
            {
                id: "pw2",
                name: "【請網紅回覆ID】",
                text: "{members} 好~\n以上資訊完成後，再請回覆APP ID呦\n謝謝！"
            }
        ]
    };

    // 初始化與更新模板下拉選單
    function updateTemplates() {
        const scenario = document.getElementById('scenario').value;
        const templateSelect = document.getElementById('template');
        templateSelect.innerHTML = '';

        if (templateData[scenario]) {
            templateData[scenario].forEach(temp => {
                const option = document.createElement('option');
                option.value = temp.id;
                option.textContent = temp.name;
                templateSelect.appendChild(option);
            });
        }
    }

    // 生成最終訊息
    function generateMessage() {
        const scenario = document.getElementById('scenario').value;
        const members = document.getElementById('members').value || "xxx";
        const templateId = document.getElementById('template').value;

        const selectedTemplate = templateData[scenario].find(t => t.id === templateId);
        
        if (selectedTemplate) {
            const finalMessage = selectedTemplate.text.replace(/{members}/g, members);
            document.getElementById('resultText').textContent = finalMessage;
        }
    }

    // 複製到剪貼簿
    function copyToClipboard() {
        const text = document.getElementById('resultText').textContent;
        navigator.clipboard.writeText(text).then(() => {
            alert('訊息已成功複製到剪貼簿！');
        }).catch(err => {
            alert('複製失敗，請手動複製。');
        });
    }

    // 網頁載入時先執行一次初始化
    updateTemplates();
</script>

</body>
</html>
