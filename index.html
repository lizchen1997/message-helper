<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訊息自動回覆模板產生器</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 24px;
            color: var(--primary);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }
        select, input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: var(--primary-hover);
        }
        .result-box {
            margin-top: 24px;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 15px;
            border-radius: 6px;
            position: relative;
        }
        #resultText {
            white-space: pre-wrap;
            word-break: break-all;
            margin: 0;
            font-size: 15px;
            line-height: 1.6;
        }
        .copy-btn {
            margin-top: 10px;
            background-color: #10b981;
        }
        .copy-btn:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💬 訊息快速回覆產生器</h1>
    
    <!-- 1. 選擇情境 -->
    <div class="form-group">
        <label for="scenario">1. 選擇溝通情境</label>
        <select id="scenario" onchange="updateTemplates()">
            <option value="dietitian_match">配對營養師</option>
            <option value="ask_time">詢問一對一分析時間</option>
        </select>
    </div>

    <!-- 2. 輸入參與人員 -->
    <div class="form-group">
        <label for="members">2. 參與人員 / 網紅 / 客戶姓名</label>
        <input type="text" id="members" placeholder="例如：王小明" value="">
    </div>

    <!-- 3. 選擇訊息語氣/模板 -->
    <div class="form-group">
        <label for="template">3. 選擇訊息模板</label>
        <select id="template">
            <!-- 這裡會根據情境動態更新 -->
        </select>
    </div>

    <button class="btn" onclick="generateMessage()">✨ 生成訊息內容</button>

    <!-- 成果展示與複製 -->
    <div class="result-box">
        <label>生成結果：</label>
        <p id="resultText">填寫上方欄位並點擊「生成訊息」...</p>
        <button class="btn copy-btn" onclick="copyToClipboard()">📋 複製訊息</button>
    </div>
</div>

<script>
    // 定義所有情境與模板資料
    const templateData = {
        dietitian_match: [
            { 
                id: "dm1", 
                name: "【一對一分析資料】", 
                text: "我們將安排營養師進行一對一分析以及合約製作\n請您提供以下資訊，以便我們進行後續的作業：\n• 本名：\n• 手機號碼：\n⚠️請提供本人使用的手機號碼，後續資料將綁定此門號，請於問卷及 APP 登入使用相同號碼。\n• 本人常用 Email（系統通知使用）：\n• 合約收件 Email（如同上可免填）：\n•勞報/開立發票（如開發票請提供公司名）：\n\n因後續將提供保健品，預計會在開課前寄出，所以寄送的收件資訊也同步麻煩了!\n\n• 收件人：\n• 收件地址：\n• 收件電話：\n\n以上再麻煩了，感謝!" 
            }
        ],
        ask_time: [
            { 
                id: "at1", 
                name: "【營養師實體時間】", 
                text: "{members} 好~ 請問x/x ~ x/x 是否有可以進行實體一對一分析的時間呢？再麻煩提供3個可以的時段，謝謝！" 
            },
            { 
                id: "at2", 
                name: "【營養師線上時間】", 
                text: "{members} 好~ 請問x/x ~ x/x 是否有可以進行線上一對一分析的時間呢？再麻煩提供3個可以的時段，謝謝！" 
            },
            { 
                id: "at3", 
                name: "【約網紅一對一分析時間】", 
                text: "{members} 您好~ 營養師已提供一對一體態與飲食分析的時間了!\n服務包含：\n1.專業身體組成量測\n2.身體數據評估、飲食習慣檢視以及荷爾蒙體質評測。\n\n時間約 30 分鐘/人\n但建議還是可以多預留一些時間比較好😊\n時段如下：\n\n\n請問哪個時段方便呢？" 
            }
        ]
    };

    // 初始化與更新模板下拉選單
    function updateTemplates() {
        const scenario = document.getElementById('scenario').value;
        const templateSelect = document.getElementById('template');
        templateSelect.innerHTML = '';

        templateData[scenario].forEach(temp => {
            const option = document.createElement('option');
            option.value = temp.id;
            option.textContent = temp.name;
            templateSelect.appendChild(option);
        });
    }

    // 生成最終訊息
    function generateMessage() {
        const scenario = document.getElementById('scenario').value;
        const members = document.getElementById('members').value || "xxx";
        const templateId = document.getElementById('template').value;

        // 尋找對應的模板內容
        const selectedTemplate = templateData[scenario].find(t => t.id === templateId);
        
        if (selectedTemplate) {
            // 取代其中的 {members} 關鍵字
            const finalMessage = selectedTemplate.text.replace(/{members}/g, members);
            document.getElementById('resultText').textContent = finalMessage;
        }
    }

    // 複製到剪貼簿
    function copyToClipboard() {
        const text = document.getElementById('resultText').textContent;
        navigator.clipboard.writeText(text).then(() => {
            alert('訊息已成功複製到剪貼簿！');
        }).catch(err => {
            alert('複製失敗，請手動複製。');
        });
    }

    // 網頁載入時先執行一次初始化
    updateTemplates();
</script>

</body>
</html>
