<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訊息自動回覆模板產生器</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 24px;
            color: var(--primary);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }
        select, input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: var(--primary-hover);
        }
        .result-box {
            margin-top: 24px;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 15px;
            border-radius: 6px;
            position: relative;
        }
        #resultText {
            white-space: pre-wrap;
            word-break: break-all;
            margin: 0;
            font-size: 15px;
            line-height: 1.6;
        }
        .copy-btn {
            margin-top: 10px;
            background-color: #10b981;
        }
        .copy-btn:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💬 訊息快速回覆產生器</h1>
    
    <!-- 1. 選擇情境 -->
    <div class="form-group">
        <label for="scenario">1. 選擇溝通情境</label>
        <select id="scenario" onchange="updateTemplates()">
            <option value="dietitian_match">配對營養師</option>
            <option value="ask_time">詢問一對一分析時間</option>
            <option value="prep_work_1v1">一對一分析事前作業</option>
            <option value="appointment_reservation_1v1">給網紅的時間提醒</option>
            <option value="ask_course_guidance_time">詢問期中課程指導時間</option>
            <option value="on_task_assistant">on task給助理</option>
        </select>
    </div>

    <!-- 3. 選擇訊息語氣/模板 -->
    <div class="form-group">
        <label for="template">2. 選擇訊息模板</label>
        <select id="template" onchange="toggleInputFields()">
            <!-- 這裡會根據情境動態更新 -->
        </select>
    </div>

    <!-- 變數輸入區區塊 -->
    <hr style="border: 0; border-top: 1px dashed #d1d5db; margin: 25px 0;">

    <!-- 欄位一 (基礎是 members，特殊狀態是 members1) -->
    <div class="form-group" id="group-members1">
        <label id="label-members1" for="members1">3-1. 參與人員 / 網紅 / 客戶姓名</label>
        <input type="text" id="members1" placeholder="例如：王小明" value="">
    </div>

    <!-- 欄位二 (助理名稱 或 網紅本名) -->
    <div class="form-group" id="group-members2" style="display: none;">
        <label id="label-members2" for="members2">3-2. 變數欄位二</label>
        <input type="text" id="members2" placeholder="" value="">
    </div>

    <!-- 欄位三 (僅在線上1v1提醒出現：營養師名稱) -->
    <div class="form-group" id="group-members3" style="display: none;">
        <label id="label-members3" for="members3">3-3. 營養師名稱 (members3)</label>
        <input type="text" id="members3" placeholder="例如：宜婷營養師" value="">
    </div>

    <!-- 欄位四 (僅在純量測提醒出現：預約地點選擇) -->
    <div class="form-group" id="group-address1" style="display: none;">
        <label id="label-address1" for="address1">3-4. 預約地點 (address1)</label>
        <select id="address1">
            <option value="taipei">台北 初日診所</option>
            <option value="hsinchu">新竹 初日診所</option>
            <option value="taichung">台中 真愛美學診所</option>
            <option value="tainan">台南 中正耳鼻喉科診所</option>
            <option value="kaohsiung">高雄 初日診所</option>
        </select>
    </div>

    <button class="btn" onclick="generateMessage()">✨ 生成訊息內容</button>

    <!-- 成果展示與複製 -->
    <div class="result-box">
        <label>生成結果：</label>
        <p id="resultText">填寫上方欄位並點擊「生成訊息」...</p>
        <button class="btn copy-btn" onclick="copyToClipboard()">📋 複製訊息</button>
    </div>
</div>

<script>
    // 預約地點對應資料：地點名稱 + 地址
    const locationData = {
        taipei:    { name: "台北初日診所",     address: "台北市中山區民生東路二段161號4樓（第一銀行樓上）" },
        hsinchu:   { name: "新竹初日診所",     address: "新竹市東區占梅路16號" },
        taichung:  { name: "台中真愛美學診所", address: "台中市西區精誠路260號" },
        tainan:    { name: "台南中正耳鼻喉科診所", address: "台南市永康區正強街231號" },
        kaohsiung: { name: "高雄初日診所",     address: "高雄市左營區自由二路220號" }
    };

    // 定義所有情境與模板資料
    const templateData = {
        dietitian_match: [
            { 
                id: "dm1",

            },
            { 
                id: "dm2", 
                name: "【詢問國外網紅一對一分析資料】", 
                text: "{members} 好~\n\n我們將安排營養師進行一對一分析以及合約製作\n請您提供以下資訊，以便我們進行後續的作業：\n• 本名：\n• 國外手機號碼：\n⚠️請提供本人使用的手機號碼，後續資料將綁定此門號，請於問卷及 APP 登入使用相同號碼。\n• 本人常用 Email（系統通知使用）：\n• 合約收件 Email（如同上可免填）：\n•勞報/開立發票（如開發票請提供公司名）：\n\n以上再麻煩了，感謝!" 
            }
        ],
        ask_time: [
            { 
                id: "at1", 
                name: "【營養師實體時間】", 
                text: "{members} 好~ \n我是立慈~~\n之後會和Ellie一起協助配對營養師和追蹤體驗流程喔！\n請問x/x ~ x/x 前是否有可以現場一對一分析的時間呢？\n建議營養師可安排我們的預約與下一個預約有10分鐘緩衝，讓你也可以歇口氣～😮‍💨\n\n可預約時段：如 x/xx  14:00-17:00 (結束時間)💕\n\n需避開時段：\n\n特殊需求 (如完全不可遲到、許願哪日優先安排)：" 
            },
            { 
                id: "at2",

                text: "{members} 好~ \n我是立慈~~\n之後會和Ellie一起協助配對營養師和追蹤體驗流程喔！\n請問x/x ~ x/x 前是否有可以線上一對一分析的時間呢？\n建議營養師可安排我們的預約與下一個預約有10分鐘緩衝，讓你也可以歇口氣～😮‍💨\n\n可預約時段：如 x/xx  14:00-17:00 (結束時間)💕\n\n需避開時段：\n\n特殊需求 (如完全不可遲到、許願哪日優先安排)：" 
            },
            { 
                id: "at3", 
                name: "【約網紅一對一分析時間】", 
                text: "{members} 您好~ \n營養師已提供一對一體態與飲食分析的時間了!\n服務包含：\n1.專業身體組成量測\n2.身體數據評估、飲食習慣檢視以及荷爾蒙體質評測。\n\n時間約 30 分鐘/人\n但建議還是可以多預留一些時間比較好😊\n時段如下：\n\n\n請問哪個時段方便呢？" 
            }
        ],
        appointment_reservation_1v1: [
            { 
                id: "ar1", 
                name: "【實體1v1提醒】",

            },
            { 
                id: "ar2", 
                name: "【線上1v1提醒】", 
                text: "{members1} 好~ \n\n🔖一對一提醒\n姓名：{members2}\n時間：\n營養師：{members3}\n地點：線上\nGoogle meet：" 
            },
            { 
                id: "ar3", 
                name: "【量測提醒】", 
                text: "{members1} 好~\n\n🔖純量測提醒\n姓名：{members2}\n預約時間：\n預約地點：{address1}\n地址：{address1_detail}"
            }
        ],
        ask_course_guidance_time: [
            {
                id: "cg1",
                name: "【營養師實體回診時間】",
                text: "{members} 好~ \n請問x/x ~ x/x 是否有可以進行實體課程指導的時間呢？\n再麻煩提供3個可以的時段，謝謝！"
            },
            {
                id: "cg2",
                name: "【營養師線上回診時間】",
                text: "{members} 好~ \n請問x/x ~ x/x 是否有可以進行線上課程指導的時間呢？\n再麻煩提供3個可以的時段，謝謝！"
            },
            {
                id: "cg3",
                name: "【約網紅期中課程指導實體時間】",
                text: "{members} 好~ \n課程進行到一半了，我們會安排您和營養師一對一的課程指導時間\n營養師會和您一起回顧這段時間的努力，確認目前的飲食是否需要調整，來達到我們一起訂的目標💪\n如果有任何問題也可以趁這個機會和營養師提出喔🙇\n\n時間約 15 分鐘/人\n開課前提醒：但建議還是可以多預留一些時間比較好😊\n\n地點：台北初日\n地址：台北市中山區民生東路二段161號4樓（第一銀行樓上）\n時段如下：\n\n\n請問哪個時段方便呢？"
            },
            {
                id: "cg4",
                name: "【約網紅期中課程指導線上時間】",
                text: "{members} 好~ \n課程進行到一半了，我們會安排您和營養師線上一對一的課程指導時間\n營養師會和您一起回顧這段時間的努力，確認目前的飲食是否需要調整，來達到我們一起訂的目標💪\n如果有 any 問題也可以趁這個機會和營養師提出喔🙇\n\n時間約 15 分鐘/人\n重播：但建議還是可以多預留一些時間比較好😊\n\n線上時段如下：\n\n\n請問哪個時段方便呢？"
            }
        ],
        prep_work_1v1: [
            {
                id: "pw1",
                name: "【問卷填寫】",
                text: "{members} 好~\n這邊提供營養師分析前的執行事項，再麻煩一對一分析前按照以下步驟完成，謝謝！\n\n【步驟1】\n🏷️下載 Cofit App『Cofit - 我的專屬營養師』\nApple: https://tinyurl.com/28ta4b6z\n安卓: https://goo.gl/uM0y4v\n⚠️提醒：為確保資料一致，登入APP與填寫問卷時，請使用先前提供的手機號碼，並於相關作業中皆使用同一門號。\n\n【步驟2】\n🏷️完成 Cofit APP 下載後，請填寫 2 份問卷唷！\n1️⃣飲食及生活習慣問卷：https://hi.cofit.me/6GU5p\n2️⃣六大荷爾蒙體質分析問卷：https://hi.cofit.me/fl97W\n- 請使用本人的手機號碼登入問卷系統，且不得與他人共用號碼\n- 請盡量以「真實姓名」填寫，若以其他姓名填寫也請主動跟我們說，避免營養師核對不到資料無法為您分析喔！\n- 完成問卷後請確認「提交」並務必回來跟我說，以利營養師核對唷！\n\n【步驟3】\n🏷️2 日自主飲食紀錄\n請上傳個人飲食照片至 Cofit App。 一對一分析時，營養師將會透過 App 檢視您的 2 日飲食唷！\n飲食記錄請上傳至「日記」頁面，教學影片 https://youtube.com/shorts/xDKhdt7lGyg\n⚠️小提醒：飲食記錄請上傳至「日記」頁面，不是跟營養師的對話裡喔！"
            },
             {
                id: "pw2",
                name: "【預約量測(線上一對一分析前都需要)】",
                text: "{members} 好~\n營養師在與您一對一分析前，需要先了解您目前的身體數據。\n請問家裡或是否有配合的健身房可以量測體脂率呢？\n如果沒有的話，在您的居住地附近我們有配合的據點，可以進行量測喔～"
            }
        ],
        on_task_assistant: [
            {
                id: "ota1",
                name: "【進團班】",
                text: "【 KOL {members1} _進團班】 麻煩 {members2}，謝謝！\n進班資訊網址："
            },
             {
                id: "ota2",
                name: "勞報單點點簽",
                text: "【KOL {members1}_勞報單點點簽】麻煩 {members2}，謝謝！\nEmail：\n勞報單："
            },
              {
                id: "ota3",
                name: "後補保健品和大禮包",
                text: "【KOL {members1}_課程保健品和大禮包寄送】麻煩 {members2}，謝謝！\n連結："
            }
        ]
    };

    // 初始化與更新模板下拉選單
    function updateTemplates() {
        const scenario = document.getElementById('scenario').value;
        const templateSelect = document.getElementById('template');
        
        templateSelect.innerHTML = '';

        if (templateData[scenario]) {
            templateData[scenario].forEach(temp => {
                const option = document.createElement('option');
                option.value = temp.id;
                option.textContent = temp.name;
                templateSelect.appendChild(option);
            });
        }
        
        // 每次情境大換，都要重新確認輸入欄位的顯示狀態
        toggleInputFields();
    }

    // 依據當前選取的「情境」與「模板」動態調整輸入框的標籤與顯示狀態
    function toggleInputFields() {
        const scenario = document.getElementById('scenario').value;
        const templateId = document.getElementById('template').value;
        
        const label1 = document.getElementById('label-members1');
        const label2 = document.getElementById('label-members2');
        
        const group2 = document.getElementById('group-members2');
        const group3 = document.getElementById('group-members3');
        const group4 = document.getElementById('group-address1');
        
        const input2 = document.getElementById('members2');

        // 狀態重置：預設隱藏欄位二、三、四
        group2.style.display = 'none';
        group3.style.display = 'none';
        group4.style.display = 'none';
        label1.textContent = "3-1. 參與人員 / 網紅 / 客戶姓名";

        // 分支判斷
        if (scenario === 'on_task_assistant') {
            label1.textContent = "3-1. 網紅 / 營養師姓名 (members1)";
            label2.textContent = "3-2. 助理姓名 (members2)";
            input2.placeholder = "例如：小美";
            group2.style.display = 'block';
            
        } else if (scenario === 'appointment_reservation_1v1' && templateId === 'ar2') {
            label1.textContent = "3-1. 網紅名稱 (members1)";
            label2.textContent = "3-2. 網紅本名 (members2)";
            input2.placeholder = "例如：陳大明";
            group2.style.display = 'block';
            group3.style.display = 'block';
            
        } else if (scenario === 'appointment_reservation_1v1' && templateId === 'ar3') {
            label1.textContent = "3-1. 網紅 / 客戶稱呼 (members1)";
            label2.textContent = "3-2. 網紅本名 (members2)";
            input2.placeholder = "例如：陳大明";
            group2.style.display = 'block';
            group4.style.display = 'block';
        }
    }

    // 生成最終訊息
    function generateMessage() {
        const scenario = document.getElementById('scenario').value;
        const templateId = document.getElementById('template').value;
        
        const members1 = document.getElementById('members1').value || "xxx";
        const members2 = document.getElementById('members2').value || "xxx";
        const members3 = document.getElementById('members3').value || "xxx";

        const selectedTemplate = templateData[scenario].find(t => t.id === templateId);
        
        if (selectedTemplate) {
            let finalMessage = selectedTemplate.text;
            
            if (scenario === 'on_task_assistant') {
                finalMessage = finalMessage.replace(/{members1}/g, members1);
                finalMessage = finalMessage.replace(/{members2}/g, members2);
            } else if (scenario === 'appointment_reservation_1v1' && templateId === 'ar2') {
                finalMessage = finalMessage.replace(/{members1}/g, members1);
                finalMessage = finalMessage.replace(/{members2}/g, members2);
                finalMessage = finalMessage.replace(/{members3}/g, members3);
            } else if (scenario === 'appointment_reservation_1v1' && templateId === 'ar3') {
                const addressKey = document.getElementById('address1').value;
                const location = locationData[addressKey];
                finalMessage = finalMessage.replace(/{members1}/g, members1);
                finalMessage = finalMessage.replace(/{members2}/g, members2);
                finalMessage = finalMessage.replace(/{address1_detail}/g, location.address);
                finalMessage = finalMessage.replace(/{address1}/g, location.name);
            } else {
                finalMessage = finalMessage.replace(/{members}/g, members1);
            }
            
            document.getElementById('resultText').textContent = finalMessage;
        }
    }

    // 複製到剪貼簿
    function copyToClipboard() {
        const text = document.getElementById('resultText').textContent;
        navigator.clipboard.writeText(text).then(() => {
            alert('訊息已成功複製到剪貼簿！');
        }).catch(err => {
            alert('複製失敗，請手動複製。');
        });
    }

    // 網頁載入時先執行一次初始化
    updateTemplates();
