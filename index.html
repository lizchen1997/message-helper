<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訊息自動回覆模板產生器</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 24px;
            color: var(--primary);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }
        select, input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: var(--primary-hover);
        }
        .result-box {
            margin-top: 24px;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 15px;
            border-radius: 6px;
            position: relative;
        }
        #resultText {
            white-space: pre-wrap;
            word-break: break-all;
            margin: 0;
            font-size: 15px;
            line-height: 1.6;
        }
        .copy-btn {
            margin-top: 10px;
            background-color: #10b981;
        }
        .copy-btn:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💬 訊息快速回覆產生器</h1>
    
    <!-- 1. 選擇情境 -->
    <div class="form-group">
        <label for="scenario">1. 選擇溝通情境</label>
        <select id="scenario" onchange="updateTemplates()">
            <option value="meeting">會議通知 / 邀約</option>
            <option value="delay">進度延遲 / 請假告知</option>
            <option value="handover">工作交接 / 進度回報</option>
        </select>
    </div>

    <!-- 2. 輸入參與人員 -->
    <div class="form-group">
        <label for="members">2. 參與人員 (用逗號隔開)</label>
        <input type="text" id="members" placeholder="例如：王經理, 小明, Tina" value="團隊夥伴">
    </div>

    <!-- 3. 選擇訊息語氣/模板 -->
    <div class="form-group">
        <label for="template">3. 選擇訊息模板</label>
        <select id="template">
            <!-- 這裡會根據情境動態更新 -->
        </select>
    </div>

    <button class="btn" onclick="generateMessage()">✨ 生成訊息內容</button>

    <!-- 成果展示與複製 -->
    <div class="result-box">
        <label>生成結果：</label>
        <p id="resultText">填寫上方欄位並點擊「生成訊息」...</p>
        <button class="btn copy-btn" onclick="copyToClipboard()">📋 複製訊息</button>
    </div>
</div>

<script>
    // 定義所有情境與模板資料
    const templateData = {
        meeting: [
            { id: "m1", name: "【正式】正式會議邀約", text: "您好，\n\n預計與 {members} 進行一場會議，討論接下來的專案細節。以下為暫定時間，再請確認是否方便，謝謝！" },
            { id: "m2", name: "【輕快】小組快速對齊", text: "嗨大家！\n\n想找 {members} 快速對齊一下進度，預計佔用 15 分鐘，我們線上見！" }
        ],
        delay: [
            { id: "d1", name: "【抱歉】需要延期交付", text: "您好，關於本次任務，因目前遇到技術調整，需要再與 {members} 重新校對。預計會稍微延遲交付，非常抱歉，有最新進度會立刻同步！" },
            { id: "d2", name: "【請假】緊急突發請假", text: "各位夥伴好，今日因身體不適需請病假一天。手邊工作已請 {members} 協助留意，如有緊急事項歡迎隨時留言，謝謝體諒。" }
        ],
        handover: [
            { id: "h1", name: "【每日】今日進度更新", text: "大家辛苦了！今日進度匯報：\n1. 已完成主要框架建立。\n2. 已與 {members} 確認對接細節。\n明日預計持續推進測試，感謝配合。" },
            { id: "h2", name: "【交接】專案事項交接", text: "您好，這部分的後續業務將交接給 {members} 負責。後續有任何問題，皆可直接與他們聯繫，謝謝這陣子以來的協助！" }
        ]
    };

    // 初始化與更新模板下拉選單
    function updateTemplates() {
        const scenario = document.getElementById('scenario').value;
        const templateSelect = document.getElementById('template');
        templateSelect.innerHTML = '';

        templateData[scenario].forEach(temp => {
            const option = document.createElement('option');
            option.value = temp.id;
            option.textContent = temp.name;
            templateSelect.appendChild(option);
        });
    }

    // 生成最終訊息
    function generateMessage() {
        const scenario = document.getElementById('scenario').value;
        const members = document.getElementById('members').value || "相關人員";
        const templateId = document.getElementById('template').value;

        // 尋找對應的模板內容
        const selectedTemplate = templateData[scenario].find(t => t.id === templateId);
        
        if (selectedTemplate) {
            // 取代其中的 {members} 關鍵字
            const finalMessage = selectedTemplate.text.replace(/{members}/g, members);
            document.getElementById('resultText').textContent = finalMessage;
        }
    }

    // 複製到剪貼簿
    function copyToClipboard() {
        const text = document.getElementById('resultText').textContent;
        navigator.clipboard.writeText(text).then(() => {
            alert('訊息已成功複製到剪貼簿！');
        }).catch(err => {
            alert('複製失敗，請手動複製。');
        });
    }

    // 網頁載入時先執行一次初始化
    updateTemplates();
</script>

</body>
</html>
